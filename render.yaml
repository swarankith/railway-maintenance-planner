services:
  # Option 1: Full-Stack Web Service (FastAPI + React SPA)
  - type: web
    name: railway-maintenance-planner
    runtime: python
    buildCommand: "pip install -r requirements.txt && cd frontend && npm install && npm run build && cd .."
    startCommand: "python -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        value: sqlite:///./railway_planner.db
